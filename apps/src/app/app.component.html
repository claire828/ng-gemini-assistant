<div class="flex h-screen flex-col items-center justify-center">
  <input
    class="w-100 border border-1 border-blue-500 px-2 text-blue-500"
    #searchInput
    type="text"
    placeholder="Search..."
  />
  <div class="m-2 flex justify-center gap-2">
    <button
      class="rounded bg-blue-500 p-1 hover:bg-blue-600"
      (click)="sendRequest('generate', searchInput.value)"
    >
      Search
    </button>
    <button
      class="rounded bg-green-500 p-1 hover:bg-green-600"
      (click)="sendRequest('search', searchInput.value)"
    >
      Web Search
    </button>
    <button
      class="rounded bg-pink-500 p-1 hover:bg-pink-600"
      (click)="sendRequest('chat', searchInput.value)"
    >
      Chat
    </button>
  </div>

  <!-- Conversation History -->
  <div class="max-h-96 w-full max-w-4xl overflow-y-auto rounded border border-gray-300 p-4">
    @if ($conversations().length === 0 && !$aiResource.isLoading()) {
      <p class="text-center text-gray-500">Start a conversation...</p>
    }

    <!-- Display existing conversations -->
    @for (conversation of $conversations(); track conversation.timestamp) {
      <app-conversation-message
        [type]="conversation.type"
        [request]="conversation.request"
        [response]="conversation.response"
        [timestamp]="conversation.timestamp"
        [isLoading]="false"
      >
      </app-conversation-message>
    }

    <!-- Current loading state (only show when actually loading) -->
    @if ($aiResource.isLoading()) {
      @let currentRequest = $currentRequest();
      @if (currentRequest) {
        <app-conversation-message
          [type]="currentRequest.type"
          [request]="currentRequest.content"
          [response]="$aiResource.value() || 'Thinking...'"
          [timestamp]="null"
          [isLoading]="true"
        >
        </app-conversation-message>
      }
    }
  </div>
</div>

<router-outlet></router-outlet>
