<div class="color-background min-h-screen">
  <header class="color-primary shadow-sm">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <h1 class="text-dark text-2xl font-bold">{{ title }}</h1>
      <button
        (click)="onFetchUpdates()"
        class="bg-accent text-dark flex cursor-pointer items-center gap-2 rounded-lg px-4 py-2 transition-colors hover:bg-green-200"
      >
        <img width="16" height="16" ngSrc="/assets/refresh.svg" alt="updates" />
        <span>Get Updates</span>
      </button>
    </div>
  </header>

  <main
    class="align-content-center flex max-w-7xl flex-col justify-center px-4 py-8 sm:px-6 lg:px-8"
  >
    <div class="mb-8">
      <h2 class="mb-4 text-xl font-semibold">My Subscriptions</h2>
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3">
        <app-subscription-card
          *ngFor="let source of contentService.sources()"
          [source]="source"
        ></app-subscription-card>
        <!-- <core-icon-button
          [name]="'Add Source'"
          [color]="'secondary'"
          (buttonClick)="onAddSource()"
        ></core-icon-button> -->
      </div>
    </div>

    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xl font-semibold">Latest Content</h2>
      <div class="flex items-center gap-2">
        <button
          (click)="onToggleTranslation()"
          [class]="showTranslation() ? 'bg-accent' : 'bg-secondary'"
          class="flex cursor-pointer items-center gap-1 rounded-full px-3 py-1"
        >
          <img alt="Translate" ngSrc="/assets/earth.svg" width="16" height="16" />
          <span>Translate</span>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (item of contentService.content(); track item.id) {
        <app-content-card [item]="item" [showTranslation]="showTranslation()"></app-content-card>
      }
    </div>
  </main>
</div>
